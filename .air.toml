# Air — live-reload для локальной разработки.
# Запуск: make dev (цель сама подгружает .env и зовёт air).
# Это инструмент разработчика: прод собирается через Dockerfile, air там не участвует.
root = "."
tmp_dir = "tmp"

[build]
  # Точка входа — cmd/app, как в Makefile (go run ./cmd/app/).
  cmd = "go build -o ./tmp/app-cmd ./cmd/app/"
  entrypoint = "./tmp/app-cmd"
  # Следим только за Go-исходниками и yaml-конфигами.
  include_ext = ["go", "yml", "yaml"]
  exclude_dir = ["tmp", "vendor", "tests", "migrations", "report", "config"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[misc]
  # Чистим бинарь при выходе.
  clean_on_exit = true
